<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001133;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002266;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00f5ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Shield background -->
  <path d="M100 15 L170 45 L170 100 C170 140 140 168 100 182 C60 168 30 140 30 100 L30 45 Z"
        fill="url(#innerGrad)" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Shield inner border -->
  <path d="M100 28 L158 53 L158 100 C158 133 133 157 100 169 C67 157 42 133 42 100 L42 53 Z"
        fill="none" stroke="#00f5ff" stroke-width="0.8" opacity="0.4"/>

  <!-- Circuit lines left -->
  <line x1="52" y1="80" x2="72" y2="80" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="120" x2="72" y2="120" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  <circle cx="52" cy="80" r="2" fill="#00f5ff" opacity="0.6"/>
  <circle cx="52" cy="120" r="2" fill="#00f5ff" opacity="0.6"/>

  <!-- Circuit lines right -->
  <line x1="128" y1="80" x2="148" y2="80" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  <line x1="128" y1="120" x2="148" y2="120" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
  <circle cx="148" cy="80" r="2" fill="#00f5ff" opacity="0.6"/>
  <circle cx="148" cy="120" r="2" fill="#00f5ff" opacity="0.6"/>

  <!-- Eye / Scan element -->
  <ellipse cx="100" cy="95" rx="28" ry="16" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
  <circle cx="100" cy="95" r="9" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="100" cy="95" r="4" fill="#00f5ff" opacity="1" filter="url(#glow)"/>

  <!-- Scan line -->
  <line x1="72" y1="95" x2="128" y2="95" stroke="#00f5ff" stroke-width="0.6" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- IQ Text -->
  <text x="100" y="148" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="22" font-weight="bold" fill="url(#shieldGrad)" filter="url(#glow)"
        letter-spacing="6">IQ</text>

  <!-- Bottom accent dots -->
  <circle cx="85" cy="158" r="1.5" fill="#00f5ff" opacity="0.6"/>
  <circle cx="100" cy="161" r="1.5" fill="#00f5ff" opacity="0.8"/>
  <circle cx="115" cy="158" r="1.5" fill="#00f5ff" opacity="0.6"/>

  <!-- Corner scan markers -->
  <path d="M38 60 L38 50 L48 50" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M152 50 L162 50 L162 60" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M38 130 L38 140 L48 140" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M152 140 L162 140 L162 130" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.5"/>
</svg>
