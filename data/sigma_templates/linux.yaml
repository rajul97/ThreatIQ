# T1071.001 - DNS Tunneling Detection
title: Suspicious High-Volume DNS Queries - Possible DNS Tunneling
id: f4a5b6c7-d8e9-0123-fabc-456789012345
status: stable
description: Detects unusually high DNS query volume from a single host, potentially indicating DNS tunneling
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
logsource:
  product: linux
  service: syslog
detection:
  selection:
    program: 'named'
    message|contains: 'query:'
  filter_common:
    message|contains:
      - 'google.com'
      - 'cloudflare.com'
      - 'amazon.com'
      - 'microsoft.com'
  timeframe: 60s
  condition: selection and not filter_common | count() by src_ip > 500
falsepositives:
  - DNS servers themselves
  - High-traffic legitimate applications
level: medium

