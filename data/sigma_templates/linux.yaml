# T1190 - Exploit Public-Facing Application
title: Web Application Attack Patterns on Linux
id: c5d6e7f8-a9b0-1234-cdef-567890123456
status: stable
description: Detects common web application attack patterns in web server logs
references:
  - https://attack.mitre.org/techniques/T1190/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  product: linux
  service: apache
detection:
  selection:
    request|contains:
      - '../../../'
      - '..%2f'
      - '%2e%2e%2f'
      - '/etc/passwd'
      - '/etc/shadow'
      - '/proc/self/environ'
      - 'cmd=cat'
      - 'exec(chr('
      - 'base64_decode'
      - 'system('
      - 'passthru('
      - 'eval('
      - ';cat '
      - '|cat '
      - '&&cat '
      - 'union select'
      - 'UNION SELECT'
      - "' OR '1'='1"
      - "1=1--"
      - '<script>'
      - 'javascript:'
      - 'onmouseover='
      - 'onerror='
  condition: selection
falsepositives:
  - Security scanners (Burp Suite, Nikto, OWASP ZAP)
  - Penetration testing
level: high

