# T1053.003 - Cron Job Persistence
title: Suspicious Cron Job Creation
id: e5f6a7b8-c9d0-1234-efab-567890123456
status: stable
description: Detects suspicious cron job creation for persistence
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  product: linux
  service: auditd
detection:
  selection_write:
    type: PATH
    name|contains:
      - '/etc/cron'
      - '/var/spool/cron'
      - '/etc/cron.d/'
      - '/etc/cron.daily/'
      - '/etc/cron.hourly/'
      - '/etc/cron.weekly/'
      - '/etc/cron.monthly/'
    nametype: 'CREATE'
  selection_suspicious_content:
    type: EXECVE
    a0|contains:
      - 'crontab'
    a1|contains:
      - '-e'
      - '/tmp/'
      - '/dev/shm/'
      - 'wget'
      - 'curl'
      - 'bash'
      - 'python'
  condition: selection_write or selection_suspicious_content
falsepositives:
  - System administrators adding legitimate cron jobs
  - Application deployments
level: medium

