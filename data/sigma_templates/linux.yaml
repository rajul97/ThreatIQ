# T1610 - Deploy Container (Docker Abuse)
title: Suspicious Docker Container Execution
id: d2e3f4a5-b6c7-8901-defa-234567890123
status: stable
description: Detects suspicious Docker commands that could be used for container escape or privilege escalation
references:
  - https://attack.mitre.org/techniques/T1610/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1610
  - attack.privilege_escalation
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0|endswith: '/docker'
    a1|contains:
      - 'run --privileged'
      - '--privileged'
      - '-v /:/host'
      - '-v /etc:/etc'
      - '-v /root:/root'
      - '--pid=host'
      - '--network=host'
      - '--cap-add=ALL'
      - '--cap-add SYS_ADMIN'
      - '-v /var/run/docker.sock'
  condition: selection
falsepositives:
  - Legitimate privileged container deployments
  - Docker-in-Docker CI/CD pipelines
level: high

