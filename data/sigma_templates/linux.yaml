# T1059.004 - Reverse Shell Patterns
title: Linux Reverse Shell Execution
id: b2c3d4e5-f6a7-8901-bcde-f23456789012
status: stable
description: Detects common reverse shell one-liners used by attackers
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
logsource:
  product: linux
  service: auditd
detection:
  selection_bash_tcp:
    type: EXECVE
    a1|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  selection_netcat:
    type: EXECVE
    a0|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
    a1|contains:
      - ' -e '
      - ' --exec '
      - '-c '
  selection_python_socket:
    type: EXECVE
    a0|contains:
      - 'python'
    a1|contains:
      - 'import socket'
      - 's.connect'
      - 'os.dup2'
      - 'subprocess.call'
  selection_socat:
    type: EXECVE
    a0|endswith: '/socat'
    a1|contains:
      - 'EXEC:'
      - 'TCP:'
      - 'UDP:'
  condition: selection_bash_tcp or selection_netcat or selection_python_socket or selection_socat
falsepositives:
  - Penetration testing activities (authorized)
  - Network debugging
level: critical

