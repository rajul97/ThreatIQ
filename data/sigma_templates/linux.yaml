# T1059.004 - Unix Shell Execution
title: Suspicious Bash/Shell Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: stable
description: Detects suspicious shell commands commonly used in Linux-based attacks
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: ThreatIQ
date: 2025/01/01
modified: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0|contains:
      - '/bin/bash'
      - '/bin/sh'
      - '/bin/zsh'
      - '/usr/bin/python'
      - '/usr/bin/python3'
      - '/usr/bin/perl'
      - '/usr/bin/ruby'
  selection_suspicious:
    a1|contains:
      - '-i >& /dev/tcp/'
      - '0>&1'
      - 'nc -e'
      - 'ncat -e'
      - 'mkfifo'
      - '/dev/null'
      - 'base64 -d'
      - 'base64 --decode'
      - 'curl | bash'
      - 'wget -O- |'
      - 'wget -q -O-'
      - 'curl -s |'
      - 'python -c'
      - 'python3 -c'
      - 'perl -e'
      - 'ruby -e'
  condition: selection and selection_suspicious
falsepositives:
  - DevOps pipeline scripts
  - Legitimate base64 decoding operations
level: high
fields:
  - a0
  - a1
  - pid
  - ppid
  - uid
  - auid

