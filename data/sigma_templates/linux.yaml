# T1070.002 - Clear Linux Logs
title: Linux Log Files Cleared or Deleted
id: a3b4c5d6-e7f8-9012-abcd-345678901234
status: stable
description: Detects clearing or deletion of Linux log files for anti-forensics
references:
  - https://attack.mitre.org/techniques/T1070/002/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1070.002
logsource:
  product: linux
  service: auditd
detection:
  selection_truncate:
    type: EXECVE
    a0|endswith:
      - '/truncate'
      - '/shred'
    a1|contains:
      - '/var/log/'
      - '/var/log/auth.log'
      - '/var/log/syslog'
      - '/var/log/messages'
      - '/var/log/secure'
      - '/var/log/btmp'
      - '/var/log/wtmp'
      - '/var/log/lastlog'
  selection_cat_dev_null:
    type: EXECVE
    a1|contains:
      - '> /var/log/'
      - '/dev/null > /var/log/'
  selection_rm_logs:
    type: EXECVE
    a0|endswith: '/rm'
    a1|contains:
      - '/var/log/'
  selection_history_clear:
    type: EXECVE
    a1|contains:
      - 'history -c'
      - 'history -w'
      - 'HISTSIZE=0'
      - 'HISTFILESIZE=0'
      - 'unset HISTFILE'
      - '.bash_history'
  condition: selection_truncate or selection_cat_dev_null or selection_rm_logs or selection_history_clear
falsepositives:
  - Log rotation scripts
  - Legitimate log management
level: high

