# T1041 - Exfiltration Over C2
title: Suspicious Data Transfer via curl/wget
id: e1f2a3b4-c5d6-7890-efab-123456789012
status: stable
description: Detects suspicious use of curl/wget to upload/exfiltrate data
references:
  - https://attack.mitre.org/techniques/T1041/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  product: linux
  service: auditd
detection:
  selection_curl_upload:
    type: EXECVE
    a0|endswith: '/curl'
    a1|contains:
      - ' -F '
      - ' --form '
      - ' -d @'
      - ' --data @'
      - ' -T '
      - ' --upload-file '
      - ' -X POST '
      - ' -X PUT '
  selection_wget_post:
    type: EXECVE
    a0|endswith: '/wget'
    a1|contains:
      - '--post-data'
      - '--post-file'
      - '--method=POST'
  selection_to_external:
    type: EXECVE
    a1|contains:
      - 'pastebin.com'
      - 'ngrok.io'
      - 'transfer.sh'
      - 'file.io'
      - 'gofile.io'
      - 'anonfiles.com'
      - 'tmp.ninja'
  condition: selection_curl_upload or selection_wget_post or selection_to_external
falsepositives:
  - Legitimate file upload operations
  - CI/CD pipelines uploading artifacts
level: high

