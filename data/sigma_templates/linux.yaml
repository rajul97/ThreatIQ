# T1611 - Container Escape
title: Container Escape Attempt
id: c7d8e9f0-a1b2-3456-cdef-789012345678
status: stable
description: Detects common container escape techniques
references:
  - https://attack.mitre.org/techniques/T1611/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.privilege_escalation
  - attack.t1611
logsource:
  product: linux
  service: auditd
detection:
  selection_cgroup:
    type: EXECVE
    a1|contains:
      - '/cgroup/release_agent'
      - '/sys/fs/cgroup'
      - 'notify_on_release'
  selection_proc_escape:
    type: EXECVE
    a0|endswith: '/nsenter'
    a1|contains:
      - '--target 1'
      - '-t 1'
      - '--mount'
      - '--pid'
  selection_docker_socket:
    type: SYSCALL
    a0|contains: '/var/run/docker.sock'
    syscall:
      - 'connect'
      - 'socket'
  condition: selection_cgroup or selection_proc_escape or selection_docker_socket
falsepositives:
  - Container security testing
  - Legitimate namespace operations
level: critical
