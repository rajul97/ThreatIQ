# T1562.004 - Disable or Modify System Firewall
title: iptables/firewalld Rules Modified or Disabled
id: b6c7d8e9-f0a1-2345-bcde-678901234567
status: stable
description: Detects modification or disabling of Linux firewall rules
references:
  - https://attack.mitre.org/techniques/T1562/004/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1562.004
logsource:
  product: linux
  service: auditd
detection:
  selection_iptables:
    type: EXECVE
    a0|contains:
      - '/sbin/iptables'
      - '/usr/sbin/iptables'
    a1|contains:
      - '-F'
      - '--flush'
      - '-P INPUT ACCEPT'
      - '-P FORWARD ACCEPT'
      - '-P OUTPUT ACCEPT'
  selection_ufw:
    type: EXECVE
    a0|endswith: '/ufw'
    a1|contains:
      - 'disable'
      - 'reset'
  selection_firewalld:
    type: EXECVE
    a0|endswith: '/firewall-cmd'
    a1|contains:
      - '--add-rich-rule'
      - '--add-port=0-65535'
      - 'direct --add-rule'
  condition: selection_iptables or selection_ufw or selection_firewalld
falsepositives:
  - Legitimate firewall administration
  - Network configuration changes
level: high

