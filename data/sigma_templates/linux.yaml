# T1055 - Process Injection (Linux)
title: Suspicious ptrace Usage
id: b8c9d0e1-f2a3-4567-bcde-890123456789
status: stable
description: Detects ptrace calls used for process injection on Linux
references:
  - https://attack.mitre.org/techniques/T1055/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: SYSCALL
    syscall: 'ptrace'
    a0:
      - 'PTRACE_ATTACH'
