# T1027 - Obfuscated Files / Encoded Payloads
title: Encoded Payload Execution on Linux
id: f2a3b4c5-d6e7-8901-fabc-234567890123
status: stable
description: Detects execution of base64-encoded payloads, common in malware droppers
references:
  - https://attack.mitre.org/techniques/T1027/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: linux
  service: auditd
detection:
  selection_base64_exec:
    type: EXECVE
    a1|contains:
      - 'base64 -d'
      - 'base64 --decode'
      - 'base64 -D'
      - 'openssl enc -d'
  selection_pipe_exec:
    type: EXECVE
    a1|re: '(base64|openssl).*(bash|sh|python|perl|ruby)'
  selection_echo_decode:
    type: EXECVE
    a0|endswith:
      - '/bash'
      - '/sh'
    a1|contains:
      - 'echo'
      - '|base64'
      - '|bash'
      - '|sh'
  condition: selection_base64_exec or selection_pipe_exec or selection_echo_decode
falsepositives:
  - Legitimate scripts that decode and execute content
  - Certificate management operations
level: high

