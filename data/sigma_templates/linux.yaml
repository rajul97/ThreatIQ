# T1222.002 - File and Directory Permissions Modification
title: Chmod to Make File Executable or World-Writable
id: c1d2e3f4-a5b6-7890-cdef-123456789012
status: stable
description: Detects suspicious chmod operations that could indicate malware setup
references:
  - https://attack.mitre.org/techniques/T1222/002/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1222.002
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0|endswith: '/chmod'
    a1|contains:
      - '777'
      - '4777'
      - '2777'
      - '6777'
      - '+s'
      - 'u+s'
      - 'g+s'
  selection_sensitive_paths:
    a1|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - '/proc/'
  condition: selection and selection_sensitive_paths
falsepositives:
  - Software installations
  - Legitimate administrative tasks
level: medium

