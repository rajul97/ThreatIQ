# T1071.001 - Web Traffic C2
title: Suspicious HTTP/HTTPS Beaconing Pattern
id: n1a2b3c4-d5e6-7890-abcd-ef1234567890
status: stable
description: Detects regular HTTP/HTTPS beaconing intervals indicative of C2 communication
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: ThreatIQ
date: 2025/01/01
modified: 2025/01/01
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: proxy
detection:
  selection:
    c-uri-query|contains:
      - '?id='
      - '?uid='
      - '?guid='
      - '?session='
      - '?token='
      - '?c='
      - '?cmd='
      - '?key='
  filter_legit:
    cs-host|contains:
      - 'microsoft.com'
      - 'google.com'
      - 'amazon.com'
      - 'cloudflare.com'
      - 'akamai.com'
      - 'fastly.com'
  timeframe: 3600s
  condition: selection and not filter_legit | count() by src_ip, cs-host > 20
falsepositives:
  - Legitimate applications with session tokens
  - Analytics tracking
level: medium
fields:
  - src_ip
  - dst_ip
  - cs-host
  - c-uri
  - cs-user-agent
  - sc-bytes

