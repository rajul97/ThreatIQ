      - '.exe'
      - '.dll'
      - '.bat'
      - '.cmd'
      - '.vbs'
      - '.js'
      - '.jse'
      - '.wsf'
      - '.wsh'
      - '.ps1'
      - '.msi'
      - '.hta'
      - '.scr'
      - '.pif'
      - '.cpl'
      - '.reg'
