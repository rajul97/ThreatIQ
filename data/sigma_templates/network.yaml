# T1114 - Email Collection / Business Email Compromise
title: Suspicious Email Forwarding Rule Created
id: n30b1c2d-e4f5-6789-bcde-012345678901
status: stable
description: Detects creation of email auto-forwarding rules indicating potential BEC or account compromise
references:
  - https://attack.mitre.org/techniques/T1114/003/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.collection
  - attack.t1114.003
logsource:
  category: email
  product: exchange
detection:
  selection:
    EventID:
      - 'Set-InboxRule'
      - 'New-InboxRule'
    Parameters|contains:
      - 'ForwardTo'
      - 'RedirectTo'
      - 'ForwardAsAttachmentTo'
  filter_internal:
    ForwardTo|endswith:
      - '@company.com'
      - '@internal.local'
  condition: selection and not filter_internal
falsepositives:
  - Legitimate auto-forwarding to personal accounts
  - Authorized executive email forwarding
level: high

