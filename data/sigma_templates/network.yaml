# T1048 - Exfiltration Over Alternative Protocol
title: Data Exfiltration via FTP/SCP/SFTP
id: n4d5e6f7-a8b9-0123-defa-456789012345
status: stable
description: Detects large data transfers over file transfer protocols to external destinations
references:
  - https://attack.mitre.org/techniques/T1048/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.exfiltration
  - attack.t1048
logsource:
  category: firewall
detection:
  selection_ftp:
    dst_port:
      - 21
      - 20
      - 990
      - 989
    direction: outbound
  selection_sftp_scp:
    dst_port: 22
    direction: outbound
    bytes_sent|gte: 10485760
  filter_known_destinations:
