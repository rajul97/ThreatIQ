id: n52d3e4f-a6b7-8901-defa-234567890123
status: stable
description: Detects network patterns associated with wiper malware spreading laterally
references:
  - https://attack.mitre.org/techniques/T1485/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.impact
  - attack.t1485
logsource:
  category: firewall
detection:
  selection:
    proto: 'tcp'
    dst_port:
      - 445
      - 139
      - 135
    direction: outbound
    src_ip|startswith:
      - '10.'
      - '192.168.'
      - '172.'
  timeframe: 60s
  condition: selection | count(dst_ip) by src_ip > 50
falsepositives:
  - Windows file sharing activity
  - Domain controller operations
  - Legitimate network scanning
level: high

