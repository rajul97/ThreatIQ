# T1071.001 - Cobalt Strike Beacon Detection
title: Cobalt Strike Beacon C2 Traffic
id: n2b3c4d5-e6f7-8901-bcde-f23456789012
status: stable
description: Detects Cobalt Strike beacon communication patterns including default profiles and malleable C2
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - https://github.com/Neo23x0/sigma/blob/master/rules/network/net_mal_cobaltstrike.yml
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1573
logsource:
  category: proxy
detection:
  selection_default_uri:
    c-uri|contains:
      - '/jquery-3.3.1.min.js'
      - '/updates.rss'
      - '/coin.php'
      - '/j.ad'
      - '/load'
      - '/push'
      - '/____cfduid='
  selection_ua_cs:
    cs-user-agent|contains:
      - 'Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Trident/5.0;'
      - 'Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36'
  selection_cs_headers:
    cs-cookie|contains:
      - '__cfduid='
      - '__utma='
    c-uri|contains:
      - '/visit.js'
      - '/g.pixel'
      - '/activity'
  selection_port:
    dst_port:
      - 50050
      - 443
      - 80
      - 8080
      - 8443
    c-uri|contains:
      - '/ca'
      - '/pixel'
      - '/submit.php'
  condition: selection_default_uri or (selection_ua_cs and selection_cs_headers) or selection_port
falsepositives:
  - Legitimate jQuery CDN requests
  - Cloud service traffic
level: high

