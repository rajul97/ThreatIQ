# T1190 - Exploit Public-Facing Application
title: Web Application Exploitation Attempt
id: n7a8b9c0-d1e2-3456-abcd-789012345678
status: stable
description: Detects common web application attack signatures including SQLi, XSS, LFI, RFI
references:
  - https://attack.mitre.org/techniques/T1190/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_sqli:
    request|contains:
      - "' OR '1'='1"
      - "' OR 1=1--"
      - "1' ORDER BY"
      - "UNION SELECT NULL"
      - "UNION ALL SELECT"
      - "' AND SLEEP("
      - "'; EXEC xp_"
      - "INFORMATION_SCHEMA"
      - "sys.tables"
      - "pg_sleep("
      - "waitfor delay"
  selection_lfi:
    request|contains:
      - '../../../etc/passwd'
      - '../../../etc/shadow'
      - '..%2F..%2F..%2F'
      - '%2e%2e%2f%2e%2e%2f'
      - '/proc/self/environ'
      - 'php://input'
      - 'php://filter'
      - 'data://text/plain'
  selection_rce:
    request|contains:
      - ';id;'
      - ';id|'
      - ';cat /etc/passwd'
      - '|id'
      - '|whoami'
      - '`id`'
      - '$(id)'
      - ';uname -a'
      - 'system('
      - 'exec('
      - 'passthru('
      - 'shell_exec('
  selection_xss:
    request|contains:
      - '<script>'
      - '</script>'
      - 'javascript:'
      - 'onerror='
      - 'onload='
      - 'onmouseover='
      - '<img src=x'
      - 'alert(1)'
      - 'alert(document.cookie)'
  condition: selection_sqli or selection_lfi or selection_rce or selection_xss
falsepositives:
  - Security scanners (Burp Suite, Nikto, OWASP ZAP)
  - Authorized penetration testing
level: high

