# T1071.004 - DNS Tunneling
title: DNS Tunneling Detection
id: n3c4d5e6-f7a8-9012-cdef-345678901234
status: stable
description: Detects DNS tunneling through unusually long DNS queries, high query rates, or suspicious TLD usage
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
logsource:
  category: dns
detection:
  selection_long_query:
    query|re: '.{50,}\.(com|net|org|io|co)'
  selection_high_entropy:
    query|re: '^[a-z0-9]{30,}\.'
  selection_suspicious_tld:
    query|endswith:
      - '.xyz'
      - '.tk'
      - '.ml'
      - '.ga'
      - '.cf'
      - '.pw'
      - '.cc'
      - '.top'
      - '.bit'
      - '.onion'
  selection_tools:
    query|contains:
      - 'iodine'
      - 'dns2tcp'
      - 'dnscat'
      - 'dnsc2'
  timeframe: 60s
  condition: selection_long_query or selection_high_entropy or selection_tools or (selection_suspicious_tld | count() by src_ip > 50)
falsepositives:
  - CDN services with long subdomain names
  - Some analytics and tracking domains
level: high

