# T1498 - Network Denial of Service
title: Amplification Attack Detection (DNS/NTP/SSDP)
id: n63e4f5a-b7c8-9012-efab-345678901234
status: stable
description: Detects network amplification attack patterns via DNS, NTP, or SSDP
references:
  - https://attack.mitre.org/techniques/T1498/002/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.impact
  - attack.t1498.002
logsource:
  category: network
  product: zeek
detection:
  selection_dns_amp:
    proto: 'udp'
    dst_port: 53
    orig_bytes|gte: 512
    resp_bytes|gte: 3000
  selection_ntp_amp:
    proto: 'udp'
    dst_port: 123
    orig_bytes|lte: 48
    resp_bytes|gte: 400
  selection_ssdp_amp:
    proto: 'udp'
    dst_port: 1900
    resp_bytes|gte: 1000
  condition: selection_dns_amp or selection_ntp_amp or selection_ssdp_amp
falsepositives:
  - Large DNS ANY query responses
  - NTP monitoring
level: high

