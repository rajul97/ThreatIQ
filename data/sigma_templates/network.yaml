# T1573 - Encrypted Channel / Non-Standard SSL
title: Suspicious SSL/TLS Certificate or Non-Standard Port
id: nd4b5c6d-e8f9-0123-bcde-456789012345
status: stable
description: Detects SSL/TLS connections with suspicious certificate properties or on non-standard ports
references:
  - https://attack.mitre.org/techniques/T1573/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.command_and_control
  - attack.t1573
logsource:
  category: network
  product: zeek
detection:
  selection_self_signed:
    event_type: 'ssl'
    validation_status: 'self signed certificate'
    server_name|contains:
      - '.onion'
      - '.bit'
      - 'localhost'
  selection_nonstandard_ssl:
    event_type: 'ssl'
    dst_port:
      - 4443
      - 8443
      - 9443
      - 4444
      - 1337
      - 31337
      - 8888
      - 9090
  selection_short_lived_cert:
    event_type: 'x509'
    certificate.not_valid_after|lt: 30
  condition: selection_self_signed or selection_nonstandard_ssl or selection_short_lived_cert
falsepositives:
  - Internal development servers with self-signed certs
  - Non-standard port applications
level: medium

