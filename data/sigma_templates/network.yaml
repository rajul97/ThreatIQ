# T1200 - Hardware Additions / Rogue Device
title: Rogue DHCP Server Detection
id: n74f5a6b-c8d9-0123-fabc-456789012345
status: stable
description: Detects rogue DHCP servers offering leases, potentially indicating network attack
references:
  - https://attack.mitre.org/techniques/T1200/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.initial_access
  - attack.t1200
logsource:
  category: network
  product: zeek
detection:
  selection:
    proto: 'udp'
    src_port: 67
    dst_port: 68
  filter_known_dhcp:
    src_ip:
      - '10.0.0.1'
      - '192.168.1.1'
      - '172.16.0.1'
  condition: selection and not filter_known_dhcp
falsepositives:
  - Newly added legitimate DHCP servers
  - Network reconfiguration
level: high
