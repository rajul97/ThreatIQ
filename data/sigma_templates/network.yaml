# T1566.001 - Malicious Email Attachment
title: Email with Suspicious Attachment Detected
id: n29a0b1c-d3e4-5678-abcd-901234567890
status: stable
description: Detects emails containing suspicious attachments based on file extension and size
references:
  - https://attack.mitre.org/techniques/T1566/001/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.initial_access
  - attack.t1566.001
logsource:
  category: email
detection:
  selection_malicious_ext:
