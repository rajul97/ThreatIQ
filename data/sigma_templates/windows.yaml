# T1059.001 - PowerShell Execution
title: Suspicious PowerShell Execution
id: 3b6ab547-8ec7-4fc3-a8b5-92e7a8f3d1c2
status: stable
description: Detects suspicious PowerShell command-line arguments commonly used in attacks
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: ThreatIQ
date: 2025/01/01
modified: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -w hidden'
      - ' -WindowStyle Hidden'
      - ' -nop '
      - ' -NonInteractive '
      - ' -NoProfile '
      - 'IEX('
      - 'Invoke-Expression'
      - 'Invoke-Mimikatz'
      - 'Invoke-Empire'
      - 'Invoke-Shellcode'
      - 'DownloadString'
      - 'DownloadFile'
      - 'WebClient'
      - 'Net.WebClient'
      - 'WScript.Shell'
      - 'bypass'
      - '-ExecutionPolicy bypass'
      - 'FromBase64String'
      - 'ToBase64String'
      - 'Reflection.Assembly'
      - 'System.Reflection'
      - 'OpenRead'
      - 'GetString'
      - 'AmsiInitFailed'
  condition: selection_img and selection_cli
falsepositives:
  - Legitimate administrative scripts
  - Software deployment tools (SCCM, Intune)
  - Antivirus products
level: high
fields:
  - CommandLine
  - ParentCommandLine
  - User
  - Image
  - ParentImage

