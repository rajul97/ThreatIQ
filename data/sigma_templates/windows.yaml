# T1027 - Obfuscated Files / LOLBins
title: Living Off The Land Binary Abuse (LOLBins)
id: 8g1fg09c-dgh2-9ki8-f0g0-e7j2f3k8i6h7
status: stable
description: Detects abuse of Windows built-in tools for malicious purposes (LOLBAS)
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://lolbas-project.github.io/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_certutil:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-urlcache'
      - '-decode'
      - '-decodehex'
      - '-encode'
      - '-exportPFX'
  selection_mshta:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http'
      - 'vbscript'
      - 'javascript'
  selection_regsvr32:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - '/s'
      - '/u'
      - '/i:http'
      - '/i:ftp'
      - 'scrobj.dll'
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'shell32.dll,ShellExec_RunDLL'
      - ',EntryPoint'
  selection_bitsadmin:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains:
      - '/transfer'
      - '/download'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'process call create'
      - '/node:'
      - 'shadowcopy delete'
  condition: selection_certutil or selection_mshta or selection_regsvr32 or selection_rundll32 or selection_bitsadmin or selection_wmic
falsepositives:
  - System administration tasks
  - Software deployment
level: high

