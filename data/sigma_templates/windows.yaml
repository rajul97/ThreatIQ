# T1560 - Archive Collected Data
title: Suspicious Archiving of Collected Data
id: 5x8wx76t-uxy9-6bz5-w7x7-v4a9w0b5z3y4
status: stable
description: Detects use of archiving tools to compress collected data for exfiltration
references:
  - https://attack.mitre.org/techniques/T1560/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.collection
  - attack.t1560
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\WinRAR.exe'
      - '\rar.exe'
      - '\winzip32.exe'
    CommandLine|contains:
      - ' a '
      - ' -p'
      - '-r'
  filter_user_dirs:
    CommandLine|contains:
      - 'C:\Users'
      - 'C:\Windows'
      - 'C:\ProgramData'
  condition: selection and filter_user_dirs
falsepositives:
  - Legitimate archiving of user data
  - Backup solutions
level: medium
