# T1053.005 - Scheduled Task Creation
title: Suspicious Scheduled Task Creation
id: 5d8cd769-aed9-6hf5-c7d7-b4g9c0h5f3e4
status: stable
description: Detects creation of scheduled tasks often used for persistence
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.persistence
  - attack.t1053.005
  - attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  filter_legitimate:
