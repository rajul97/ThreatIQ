# T1490 - Inhibit System Recovery (Ransomware)
title: Shadow Copy Deletion - Ransomware Indicator
id: 3l6kl54h-ilm7-4pn3-k5l5-j2o7k8p3n1m2
status: stable
description: Detects deletion of volume shadow copies, a common ransomware pre-encryption step
references:
  - https://attack.mitre.org/techniques/T1490/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'delete shadows'
      - 'Delete Shadows'
      - 'resize shadowstorage'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'shadowcopy delete'
      - 'shadowcopy where'
      - 'Delete'
  selection_powershell:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'Get-WmiObject Win32_Shadowcopy'
      - 'Win32_ShadowCopy'
      - 'Delete()'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - '/set recoveryenabled no'
      - '/set bootstatuspolicy'
      - 'ignoreallfailures'
  condition: selection_vssadmin or selection_wmic or selection_powershell or selection_bcdedit
falsepositives:
  - Legitimate backup software
  - System maintenance tasks
level: critical

