# T1059.003 - Windows Command Shell
title: Suspicious cmd.exe Execution
id: 4c7bc658-9fd8-5ge4-b6c6-a3f8b9g4e2d3
status: stable
description: Detects suspicious command shell execution patterns used in lateral movement and execution
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: ThreatIQ
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
      - '/c echo'
      - 'wscript'
      - 'cscript'
      - 'certutil -decode'
      - 'certutil -urlcache'
      - 'bitsadmin /transfer'
      - 'net user /add'
      - 'net localgroup administrators'
      - 'reg add'
      - 'schtasks /create'
      - 'at '
      - 'wmic process call create'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'whoami /all'
      - 'nltest /domain_trusts'
      - 'net view /domain'
  condition: selection
falsepositives:
  - Administrative tasks
  - Software installers
level: medium

