# T1003.001 - LSASS Memory Dumping (Credential Access)
title: LSASS Memory Access - Credential Dumping
id: 9h2gh10d-ehi3-0lj9-g1h1-f8k3g4l9j7i8
status: stable
description: Detects attempts to access LSASS memory for credential dumping (Mimikatz, ProcDump, etc.)
references:
