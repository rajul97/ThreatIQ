      - 'Set-MpPreference -DisableAntiSpyware'
      - 'Add-MpPreference -ExclusionPath'
      - 'Set-MpPreference -DisableIOAVProtection'
      - 'Set-MpPreference -DisableBehaviorMonitoring'
  selection_registry:
    TargetObject|contains:
      - 'SOFTWARE\Policies\Microsoft\Windows Defender'
      - 'SYSTEM\CurrentControlSet\Services\WinDefend'
    Details: 'DWORD (0x00000001)'
  selection_service:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'stop WinDefend'
      - 'delete WinDefend'
      - 'config WinDefend start= disabled'
  condition: selection_powershell or selection_registry or selection_service
falsepositives:
  - Legitimate security product deployments that conflict with Defender
  - Authorized IT testing
level: high

