      - '\MsMpEng.exe'
      - '\WerFault.exe'
      - '\taskmgr.exe'
      - '\svchost.exe'
      - '\csrss.exe'
  condition: selection and not filter_legit
falsepositives:
  - Legitimate security software
  - Crash dump utilities
level: critical

